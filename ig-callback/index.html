<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Instagram の連携 | NexusGuild</title>
<style>
  :root { --ink: #1a1a1a; --sub: #666; --line: #e3e3e3; --accent: #c8102e; }
  body { margin: 0; background: #fafafa; color: var(--ink); font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; line-height: 1.8; }
  main { max-width: 520px; margin: 0 auto; padding: 40px 16px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 24px 20px; }
  h1 { font-size: 1.25rem; margin: 0 0 12px; }
  p { margin: 0 0 14px; }
  .code { font-family: ui-monospace, Consolas, monospace; font-size: .85rem; word-break: break-all; background: #f3f3f3; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 0 0 12px; }
  button { width: 100%; padding: 14px; font-size: 1rem; font-weight: 700; color: #fff; background: var(--accent); border: 0; border-radius: 8px; cursor: pointer; }
  .small { font-size: .85rem; color: var(--sub); margin: 14px 0 0; }
</style>
</head>
<body>
<main>
  <div class="card" id="ok" hidden>
    <h1>許可できました。ありがとうございます！</h1>
    <p>最後に、下のボタンを押して番号をコピーし、LINE でそのまま送ってください。</p>
    <p class="code" id="code"></p>
    <button type="button" id="copy">番号をコピーする</button>
    <p class="small">この番号は1時間で使えなくなります。お手数ですが、なるべく早めに送ってください。<br>投稿を読むためだけに使い、投稿・DM・アカウントの設定には触れません。</p>
  </div>
  <div class="card" id="ng" hidden>
    <h1>許可されませんでした</h1>
    <p>連携はされていません。もう一度お試しいただくか、このページの画面を LINE で送ってください。</p>
  </div>
  <div class="card" id="none" hidden>
    <h1>Instagram の連携ページです</h1>
    <p>NexusGuild から送られたリンクから開いてください。</p>
  </div>
</main>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var code = (q.get("code") || "").replace(/#_$/, "");
  if (code) {
    document.getElementById("code").textContent = code;
    document.getElementById("ok").hidden = false;
    var btn = document.getElementById("copy");
    btn.addEventListener("click", function () {
      var done = function () { btn.textContent = "コピーしました。LINE に貼って送ってください"; };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(code).then(done, function () { window.getSelection().selectAllChildren(document.getElementById("code")); });
      } else {
        window.getSelection().selectAllChildren(document.getElementById("code"));
      }
    });
    history.replaceState(null, "", location.pathname);   // 番号をアドレス欄・履歴に残さない
  } else if (q.get("error")) {
    document.getElementById("ng").hidden = false;
  } else {
    document.getElementById("none").hidden = false;
  }
})();
</script>
</body>
</html>
