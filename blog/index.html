<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>記事｜NexusGuild</title>
<meta name="description" content="NexusGuildの記事の一覧です。">
<link rel="canonical" href="https://haru20190621-a11y.github.io/nexusguild-lp/blog/">
<meta name="site-root" content="https://haru20190621-a11y.github.io/nexusguild-lp/">
<meta property="og:title" content="記事｜NexusGuild">
<meta property="og:description" content="NexusGuildの記事の一覧です。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://haru20190621-a11y.github.io/nexusguild-lp/blog/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<style>:root{--bg:#ffffff;--bg2:#f6f5f2;--ink:#1b1b1b;--soft:#55524d;--line:#dcd9d3;--line2:#1b1b1b;
--serif:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;--sans:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
--rail:96px;--gutter:clamp(24px,7vw,120px)}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:2;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.rail{position:fixed;left:0;top:0;width:var(--rail);height:100vh;height:100dvh;border-right:1px solid var(--line);background:var(--bg);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:28px 0}
.rail-logo{font-family:var(--serif);font-weight:600;font-size:15px;letter-spacing:.08em;writing-mode:vertical-rl}
.rail-nav{display:flex;gap:34px;writing-mode:vertical-rl}
.rail-nav a{font-family:var(--serif);font-size:14px;letter-spacing:.32em;padding:0 13px;opacity:.78}
.rail-nav a:hover,.rail-nav a[aria-current]{opacity:1}
.rail-year{font-family:var(--serif);font-size:12px;letter-spacing:.3em;writing-mode:vertical-rl;color:var(--soft)}
main{margin-left:var(--rail)}
.season{text-align:center;font-size:14px;line-height:1.6;padding:6px 12px}
.page{padding:clamp(72px,10vw,140px) var(--gutter);max-width:calc(760px + 2*var(--gutter))}
.kicker{font-family:var(--serif);font-size:13px;letter-spacing:.3em;color:var(--soft)}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(26px,3.2vw,40px);line-height:1.6;letter-spacing:.08em;margin-top:20px}
.date{display:block;margin-top:18px;font-size:13px;letter-spacing:.14em;color:var(--soft)}
.body{margin-top:48px}
.body h2{font-family:var(--serif);font-weight:500;font-size:clamp(20px,2vw,24px);letter-spacing:.08em;line-height:1.7;margin-top:2.4em;padding-top:1em;border-top:1px solid var(--line)}
.body h3{font-family:var(--serif);font-weight:500;font-size:18px;margin-top:2em}
.body p,.body ul{margin-top:1.2em;line-height:2.2}
.body ul{padding-left:1.4em}
.body a{border-bottom:1px solid var(--line2)}
.cta{margin-top:72px;padding:36px clamp(20px,4vw,40px);background:var(--bg2)}
.cta p{line-height:2}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;margin-top:20px;padding:0 34px;border:1px solid var(--ink);font-family:var(--serif);font-size:14px;letter-spacing:.22em;transition:background .3s,color .3s}
.btn:hover{background:var(--ink);color:#fff}
.back{display:inline-block;margin-top:56px;padding:8px 0;font-size:14px;letter-spacing:.12em;border-bottom:1px solid var(--line2)}
.list{margin-top:56px;border-top:1px solid var(--line);list-style:none}
.list li{border-bottom:1px solid var(--line)}
.list a{display:block;padding:28px 0}
.list .t{display:block;font-family:var(--serif);font-size:clamp(18px,1.8vw,22px);letter-spacing:.06em;line-height:1.7;margin-top:6px}
.list .d{display:block;margin-top:8px;color:var(--soft);font-size:15px;line-height:1.9}
.empty{margin-top:48px;color:var(--soft)}
footer{border-top:1px solid var(--line);margin-left:var(--rail);padding:40px var(--gutter);font-size:12px;letter-spacing:.14em;color:var(--soft)}
@media (max-width:979px){:root{--rail:0px}
.rail{position:sticky;top:0;width:100%;height:56px;flex-direction:row;padding:0 20px;border-right:0;border-bottom:1px solid var(--line)}
.rail-logo,.rail-nav{writing-mode:horizontal-tb}.rail-nav{gap:22px}.rail-nav a{font-size:13px;letter-spacing:.16em;padding:12px 4px}
.rail-nav a.hide-m,.rail-year{display:none}}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}</style>

</head>
<body>
<header class="rail">
  <a class="rail-logo" href="https://haru20190621-a11y.github.io/nexusguild-lp/">NexusGuild</a>
  <nav class="rail-nav" aria-label="サイト内">
    <a class="hide-m" href="https://haru20190621-a11y.github.io/nexusguild-lp/#services">できること</a>
    <a href="https://haru20190621-a11y.github.io/nexusguild-lp/blog/" aria-current="page">記事</a>
    <a href="https://haru20190621-a11y.github.io/nexusguild-lp/#contact">お問い合わせ</a>
  </nav>
  <span class="rail-year">2026</span>
</header>
<main>
<section class="page">
<p class="kicker">NexusGuild</p>
<h1>記事</h1>
<p class="empty">まだ記事はありません。</p>
</section>
</main>
<footer>© 2026 NexusGuild</footer>
<script>
(function(){
  var root = document.querySelector('meta[name="site-root"]');
  if(!root || !window.fetch) return;
  fetch(root.content + 'season.json', {cache: 'no-store'}).then(function(r){ return r.ok ? r.json() : null; })
  .then(function(s){
    if(!s || !s.headline || !/^#[0-9a-fA-F]{6}$/.test(s.accent || '')) return;
    var d = document.createElement('div');
    d.className = 'season'; d.setAttribute('role', 'note');
    d.style.background = s.accent; d.style.color = s.text_color === '#222222' ? '#222222' : '#fff';
    d.textContent = (s.icon ? s.icon + ' ' : '') + s.headline + (s.icon ? ' ' + s.icon : '');
    var main = document.querySelector('main') || document.body;
    main.insertBefore(d, main.firstChild);
  }).catch(function(){});
})();
</script>
</body>
</html>
